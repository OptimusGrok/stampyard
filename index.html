<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Stampyard</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
:root{--ink:#1a1040;--sat:env(safe-area-inset-top);--sar:env(safe-area-inset-right);--sab:env(safe-area-inset-bottom);--sal:env(safe-area-inset-left)}
html,body{margin:0;height:100%;overflow:hidden;background:#ffd84a;font-family:"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;touch-action:none;overscroll-behavior:none;color:var(--ink)}
#app{position:fixed;top:0;left:0;right:0;bottom:auto;height:100vh;height:100dvh;max-height:var(--vvh,100dvh);display:grid;padding:calc(var(--sat) + 6px) calc(var(--sar) + 6px) calc(var(--sab) + 6px) calc(var(--sal) + 6px);
 background:repeating-conic-gradient(#ffd84a 0 25%,#ffc61a 0 50%) 0 0/28px 28px;gap:6px;
 grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top top top" "left stage right" "bot bot bot"}
.bar{display:flex;gap:6px;align-items:center;padding:6px;background:#3b2a8f;border:4px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);min-width:0;min-height:0;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
#top{grid-area:top;overflow-x:auto}
#left{grid-area:left;flex-direction:column;background:#e8384f;overflow-y:auto}
#right{grid-area:right;flex-direction:column;background:#1fa463;overflow-y:auto}
#bot{grid-area:bot;background:#1e88e5;overflow-x:auto}
.sep{flex:0 0 auto;width:3px;height:34px;border-radius:2px;background:rgba(26,16,64,.35)}
#left .sep,#right .sep{width:34px;height:3px}
.lab{flex:0 0 auto;color:#fff;font-size:10px;font-weight:900;letter-spacing:.5px;text-shadow:0 1px 0 var(--ink)}
#stage{grid-area:stage;position:relative;border:6px solid var(--ink);border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 5px 0 var(--ink);min-height:0;min-width:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#logo{font-size:26px;font-weight:900;letter-spacing:1px;margin-right:auto;padding:0 6px;white-space:nowrap;flex:0 1 auto;min-width:0;overflow:hidden}
#logo span{display:inline-block;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke;text-shadow:0 3px 0 var(--ink);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px) rotate(-4deg)}}
button{flex:0 0 auto;font:inherit;font-size:20px;width:50px;min-width:50px;height:48px;border:3px solid var(--ink);border-radius:12px;background:#fff8e1;box-shadow:0 3px 0 var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:2px;color:var(--ink)}
button small{font-size:8.5px;font-weight:900;margin-top:3px;letter-spacing:.2px;white-space:nowrap}
button:active{transform:translateY(3px);box-shadow:none}
button.on{background:#ffeb3b;outline:3px solid #fff;outline-offset:-7px}
.sw{width:32px;min-width:32px;height:32px;border-radius:50%}
.sw.on{outline:3px solid #fff;outline-offset:-8px;transform:scale(1.12)}
#soft{background:#ffb3d1;width:64px}#soft.on{background:#ff4fa0;color:#fff}
.hud{position:absolute;display:flex;gap:4px;align-items:center;background:rgba(59,42,143,.92);border:3px solid var(--ink);border-radius:14px;padding:4px 6px;color:#fff;font-weight:900;font-size:12px;box-shadow:0 3px 0 var(--ink);z-index:2}
.hud button,.mini{width:34px;min-width:34px;height:32px;font-size:15px;border-radius:9px;box-shadow:0 2px 0 var(--ink)}
.hud button small{font-size:7px;margin-top:1px}
#ghud{left:6px;top:6px;flex-direction:column;align-items:flex-start;max-width:calc(100% - 60px);opacity:.96}
#ghud button small,#vhud button small{display:none}
#ghud .row{display:flex;gap:4px;align-items:center}
#ghud.min #gpre{display:none}
#vhud{right:6px;top:50%;transform:translateY(-50%);flex-direction:column;padding:4px}
#zv{font-size:10px}
#zv{min-width:38px;text-align:center}
#grav{width:130px;height:36px;margin:0;accent-color:#ffeb3b;cursor:pointer;touch-action:none}
#ghud .gstep{width:36px;min-width:36px;height:34px;font-size:22px;font-weight:900;touch-action:none}
#gv{font-variant-numeric:tabular-nums}
#gv{min-width:44px;text-align:right}
#panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,calc(100% - 20px));max-height:calc(100% - 20px);overflow:auto;background:#fff8e1;border:4px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:10px 12px;z-index:3;display:none;font-size:13px}
#panel.open{display:block}
#panel h3{margin:2px 0 8px;font-size:17px;display:flex;align-items:center}
#panel h3 button{margin-left:auto;width:34px;min-width:34px;height:32px;font-size:15px}
#panel h4{margin:10px 0 5px;font-size:11px;letter-spacing:1px;color:#3b2a8f}
#panel .opts{display:flex;gap:5px;flex-wrap:wrap}
#panel .opts button{width:auto;min-width:0;padding:0 9px;height:34px;font-size:13px;flex-direction:row;gap:4px}
#panel p{margin:4px 0;font-size:11.5px;line-height:1.35;color:#4a3d7a}
#toast{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:6px 12px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;z-index:4;max-width:94%;overflow:hidden;text-overflow:ellipsis}
@media (orientation:portrait){
 #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto auto;grid-template-areas:"top" "left" "stage" "right" "bot";gap:5px}
 #left,#right{flex-direction:row;overflow-x:auto;overflow-y:hidden}
 #left .sep,#right .sep{width:3px;height:34px}
 #logo{font-size:16px;padding:0 1px;letter-spacing:0}
 button{width:46px;min-width:46px;height:46px}
 #top{gap:4px}#top .sep{display:none}#top button{width:41px;min-width:41px;height:44px;font-size:18px}#top button small{font-size:7.5px}
 .bar{padding:5px;gap:5px}
 #grav{width:96px}
 #bot{flex-wrap:wrap;justify-content:center;row-gap:5px}#bot .sep:last-of-type{flex-basis:100%;height:0;width:0}
 #bot .sw{width:24px;min-width:24px;height:24px}
}
@media (max-height:430px) and (orientation:landscape){
 #app{grid-template-rows:auto minmax(0,1fr);grid-template-areas:"left top right" "left stage right";grid-template-columns:auto minmax(0,1fr) auto}
 #bot{display:none}
 #top{padding:3px 5px}
 #top button{height:38px;width:44px;min-width:44px;font-size:16px}
 #left button,#right button{height:40px;width:46px;min-width:46px;font-size:17px}
 #left,#right{padding:4px;gap:4px}
 #logo{font-size:18px}
 #paint{display:flex!important}
}
#paint{display:none}
#facepal{position:absolute;z-index:6;display:none;width:min(330px,92vw);max-height:min(430px,80vh);overflow:auto;background:#fffdf4;border:3px solid #1a1040;border-radius:16px;box-shadow:0 5px 0 #1a1040;padding:8px;font-family:inherit}
#facepal.open{display:block}#facepal h4{margin:0 0 6px;font-size:14px;color:#1a1040;display:flex;justify-content:space-between;align-items:center}
#fpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:5px}
#facepal button{border:2px solid #1a1040;border-radius:10px;background:#fff;padding:4px 2px;font-size:20px;line-height:1.1;cursor:pointer;color:#1a1040}
#facepal button small{display:block;font-size:9px;font-weight:800}#facepal button.on{background:#ffeb3b}
#fprow{display:flex;gap:5px;margin:6px 0}#fprow button{flex:1;font-size:13px;font-weight:800}#fpword{flex:1;min-width:0;border:2px solid #1a1040;border-radius:10px;padding:5px 8px;font-size:14px}
#tray{position:absolute;left:6px;right:6px;bottom:6px;z-index:3;display:none;flex-direction:column;gap:5px;background:rgba(255,248,225,.97);border:4px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:6px;max-height:calc(100% - 12px);touch-action:none}
#tray.open{display:flex}
.trrow{display:flex;gap:5px;align-items:center;min-width:0}
.trscroll{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scroll-snap-type:x proximity;scrollbar-width:none;min-width:0;flex:1 1 auto;padding:2px 2px 6px}
.trscroll::-webkit-scrollbar{display:none}
.trscroll>*{scroll-snap-align:start;touch-action:pan-x}
.trwrap{position:relative;display:flex;min-width:0;flex:1 1 auto}
.trwrap::before,.trwrap::after{content:"";position:absolute;top:0;bottom:6px;width:34px;pointer-events:none;z-index:1;opacity:0;transition:opacity .2s}
.trwrap::before{left:0;background:linear-gradient(90deg,rgba(255,248,225,1),rgba(255,248,225,0))}
.trwrap::after{right:0;background:linear-gradient(-90deg,rgba(255,248,225,1),rgba(255,248,225,0))}
.trwrap.fl::before,.trwrap.fr::after{opacity:1}
.trarr{position:absolute;top:50%;transform:translateY(-55%);z-index:2;width:30px!important;min-width:30px!important;height:40px!important;font-size:16px!important;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s}
.trarr.l{left:-2px}.trarr.r{right:-2px}.trarr:active{transform:translateY(-50%);box-shadow:none}
.trwrap.fl .trarr.l,.trwrap.fr .trarr.r{opacity:1;pointer-events:auto}
#trcats button{width:auto;min-width:0;height:30px;padding:0 10px;font-size:12px;font-weight:900;flex-direction:row;gap:4px;border-radius:15px;box-shadow:0 2px 0 var(--ink)}
#trcats button.on{background:#3b2a8f;color:#fff;outline:none}
#tritems .ti{width:62px;min-width:62px;height:58px;font-size:24px}
#tritems .ti small{font-size:8px}
#tritems .ti.on{background:#ffeb3b;outline:3px solid #3b2a8f;outline-offset:-7px}
#tritems .cath{flex:0 0 auto;writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;font-weight:900;color:#3b2a8f;letter-spacing:1px;padding:0 1px}
#tropts{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:11px;font-weight:900}
#tropts label{display:flex;align-items:center;gap:5px;white-space:nowrap}
#tropts input[type=range]{width:110px;height:28px;accent-color:#3b2a8f;touch-action:pan-y}
#tropts output{min-width:52px;font-variant-numeric:tabular-nums}
#trsw{flex:1 1 100%}
#trsw .sw{width:28px;min-width:28px;height:28px}
#tray .mini{width:34px;min-width:34px;height:30px;font-size:15px}
#tray.noopt #tropts{display:none}
</style></head><body>
<div id="app">
 <div id="top" class="bar">
  <div id="logo"></div>
  <button id="play" title="Pause / play the world (P)">⏸<small>PAUSE</small></button>
  <button id="slow" title="Slow motion (S)">🐢<small>SLOW</small></button>
  <span class="sep"></span>
  <button id="undo" title="Undo (Ctrl+Z)">↶<small>UNDO</small></button>
  <button id="redo" title="Redo (Ctrl+Y)">↷<small>REDO</small></button>
  <button id="clear" title="Clear everything">🧹<small>CLEAR</small></button>
  <span class="sep"></span>
  <button id="paint" title="Soft, material and colour">🎨<small>PAINT</small></button>
  <button id="gear" title="World size, save/load and sound">⚙️<small>MORE</small></button>
 </div>
 <div id="left" class="bar"></div>
 <div id="stage"><canvas id="c"></canvas>
  <div id="ghud" class="hud" title="Gravity · scroll the mouse wheel here to change it">
   <div class="row"><button id="gtog" title="Show/hide gravity presets" style="width:30px;min-width:30px;height:28px">🌍</button><button id="gminus" class="gstep" title="Less gravity (hold to repeat)">−</button><input id="grav" type="range" min="-1.5" max="2.5" step="0.01" value="1" aria-label="Gravity"><button id="gplus" class="gstep" title="More gravity (hold to repeat)">+</button><span id="gv">1.00g</span></div>
   <div class="row" id="gpre"></div>
  </div>
  <div id="vhud" class="hud"><button id="zin" title="Zoom in">➕</button><span id="zv">100%</span><button id="zout" title="Zoom out">➖</button><button id="fit" title="Fit whole world in view (F)">⤢</button></div>
  <div id="panel"></div>
  <div id="facepal" aria-label="Choose a face"><h4><span>🎭 Pick a face</span><button id="fpx" style="font-size:13px;padding:2px 8px">✕</button></h4>
   <div id="fprow"><button id="fpauto">🤖 SMART</button><button id="fplock">🔓 LOCK</button></div>
   <div id="fprow" style="margin-top:0"><input id="fpword" placeholder="type a mood: silly, love, sleepy…" maxlength="24"><button id="fpgo" style="flex:0 0 52px">GO</button></div>
   <div id="fpgrid"></div></div>
  <div id="tray" aria-label="All stamps">
   <div class="trrow"><div class="trwrap" id="trcw"><button class="trarr l mini" data-s="trcats" title="Scroll left">◀</button><div id="trcats" class="trscroll"></div><button class="trarr r mini" data-s="trcats" title="Scroll right">▶</button></div>
    <button id="tropt" class="mini" title="Show/hide size, bounce, softness and colour options">🎛️</button><button id="trclose" class="mini" title="Close the stamp tray">✖</button></div>
   <div class="trwrap" id="triw"><button class="trarr l" data-s="tritems" title="Scroll left">◀</button><div id="tritems" class="trscroll"></div><button class="trarr r" data-s="tritems" title="Scroll right">▶</button></div>
   <div id="tropts">
    <label>📏 SIZE <input id="osize" type="range" min="50" max="200" step="5" value="100"><output id="osizev">100%</output></label>
    <label>🏀 BOUNCE <input id="obounce" type="range" min="-5" max="100" step="5" value="-5"><output id="obouncev">auto</output></label>
    <label>🍮 SOFTNESS <input id="osoft" type="range" min="0" max="100" step="5" value="0"><output id="osoftv">auto</output></label>
    <div class="trrow"><div class="trwrap" id="trsww" style="flex:1 1 auto"><button class="trarr l mini" data-s="trsw">◀</button><div id="trsw" class="trscroll"></div><button class="trarr r mini" data-s="trsw">▶</button></div></div>
   </div>
  </div>
  <div id="toast"></div></div>
 <div id="right" class="bar"></div>
 <div id="bot" class="bar"></div>
</div>
<script>
"use strict";
// ---------- Layout / UI ----------
const $=s=>document.querySelector(s);
const logo=$('#logo'),LC=['#ff5c7a','#ffeb3b','#5cf2a0','#6ad1ff','#ffa94d','#d78bff'];
logo.innerHTML=[...'Stampyard'].map((c,i)=>`<span style="color:${LC[i%6]};animation-delay:${i*.12}s">${c}</span>`).join('');
const TOOLS=[['hand','✋','GRAB','Grab & fling things · drag empty space to look around · 2 fingers on a body to stretch'],['stamp','🖌️','STAMP','Tap to stamp the chosen item · drag empty space to pan'],['draw','✏️','DRAW','Draw a shape or a plank'],['erase','🧽','ERASE','Tap or swipe to erase'],0,
 ['pin','📌','PIN','Pin a point in place (tap again to unpin)'],['rope','🪢','ROPE','Tie a rope: tap start, then end'],['band','🎗️','BAND','Stretchy elastic band: tap start, then end'],['freeze','🧊','FREEZE','Freeze / unfreeze a body in mid-air'],['face','🎭','FACE','Tap a blob to pick its face (or Smart mode)']];
const ITEMS=[['blob','😊','BLOB','Blob — always squishy, winks at you'],['box','🟥','BOX','Box'],['ball','⚽','BALL','Ball'],['crate','📦','CRATE','Wooden crate'],['plank','➖','PLANK','Plank'],['tri','🔺','TRI','Triangle'],['star','⭐','STAR','Star'],0,
 ['balloon','🎈','BALLOON','Balloon — floats up'],['bomb','💣','BOMB','Bomb — 3 second fuse'],['spring','🌀','SPRING','Bounce pad'],['fan','🌬️','FAN','Fan — blows wind; tap it with GRAB to turn it']];
const MATS=[['normal','⚪','PLAIN','Normal material'],['bouncy','🏀','BOUNCY','Bouncy — springs back'],['sticky','🍯','STICKY','Sticky — grips everything'],['ice','🧊','ICE','Ice — super slippery'],['heavy','🪨','HEAVY','Heavy — 4× the weight']];
const MATP={normal:{fric:.5,bounce:.15,im:1},bouncy:{fric:.35,bounce:.85,im:1},sticky:{fric:1,bounce:0,im:1},ice:{fric:.02,bounce:.1,im:1},heavy:{fric:.6,bounce:.05,im:.25}};
const COLORS=['#ff5c7a','#ff9f1c','#ffd23f','#5cd65c','#2ec4b6','#3a86ff','#8338ec','#ff70d4','#8d5524','#f5f5f5','#555','#111'];
const SIZES={small:['Small','fits the screen'],normal:['Normal',[1200,700]],large:['Large',[2000,1100]],huge:['Huge',[3200,1600]]};
let tool='stamp',item='blob',color='#ff5c7a',soft=false,mat='normal',playing=true,muted=false,ts=1,worldSize='small',showGrid=true;
try{const s=JSON.parse(localStorage.getItem('stampyard_settings')||'{}');if(s.muted)muted=true;if(SIZES[s.size])worldSize=s.size;if(s.grid===false)showGrid=false}catch(e){}
function saveSettings(){try{localStorage.setItem('stampyard_settings',JSON.stringify({muted,size:worldSize,grid:showGrid}))}catch(e){}}
function mkBtn(par,id,ic,lab,tip,fn){const b=document.createElement('button');b.dataset.id=id;b.title=tip||lab;b.setAttribute('aria-label',tip||lab);b.innerHTML=ic+'<small>'+lab+'</small>';b.onclick=()=>{fn(b);snd('click')};par.appendChild(b);return b}
function sep(par){const s=document.createElement('span');s.className='sep';par.appendChild(s)}
TOOLS.forEach(t=>t?mkBtn($('#left'),t[0],t[1],t[2],t[3],()=>{tool=t[0];ropeStart=null;refresh();toast(t[3])}):sep($('#left')));
ITEMS.forEach(t=>t?mkBtn($('#right'),t[0],t[1],t[2],t[3],()=>{item=t[0];tool='stamp';refresh();toast(t[0]=='blob'?'Blob is always squishy!':t[3]+' · tap to stamp')}):sep($('#right')));
const bot=$('#bot');
// ---------- Stamp tray: every stamp, in categories, in one swipeable strip ----------
const TRAY=[['🔷','Shapes',[['box','🟥','BOX','Box'],['ball','⚽','BALL','Ball'],['tri','🔺','TRI','Triangle'],['star','⭐','STAR','Star'],['heart','❤️','HEART','Heart'],['capsule','💊','CAPSULE','Capsule'],['hex','⬢','HEXAGON','Hexagon'],['plank','➖','PLANK','Plank'],['crate','📦','CRATE','Wooden crate'],['egg','🥚','EGG','Egg — wobbles as it rolls']]],
 ['🍮','Soft',[['jelly','🟪','JELLY','Jelly cube — wibbly wobbly'],['slime','🟢','SLIME','Slime puddle — oozes and sticks'],['waterb','💧','WATER','Water balloon — heavy and sloshy'],['blob','😊','BLOB','Blob — always squishy']]],
 ['🧸','Toys',[['beach','🏐','BEACH','Beach ball — light and super bouncy'],['car','🚗','CAR','Car with rolling wheels — push it!'],['seesaw','⚖️','SEESAW','Seesaw on a stand'],['tramp','🤸','TRAMPOLINE','Trampoline — bounce things on it'],['balloon','🎈','BALLOON','Balloon — floats up'],['bomb','💣','BOMB','Bomb — 3 second fuse']]],
 ['⚙️','Machines',[['magnet','🧲','MAGNET','Magnet — pulls things in'],['motor','🛞','MOTOR','Motor wheel — spins forever, flings things'],['spring','🌀','SPRING','Bounce pad'],['fan','🌬️','FAN','Fan — blows wind; tap it with GRAB to turn it']]],
 ['🧪','Slime Lab',[['pipe','🧪','SLIME PIPE','Slime pipe — drips little blobs'],['cannon','🎯','CANNON','Blob cannon — roll something in, it gets launched'],['paint','🎨','PAINT','Paint puddle — blobs that touch it change colour'],['portal','🌀','PORTALS','Portal pair — go in one, pop out the other'],['conveyor','⏩','CONVEYOR','Conveyor belt — carries things along'],['hat','🎩','HAT','Hat — stamp it on a blob (tap again for a new hat)']]],
 ['🌿','Nature',[['cloud','☁️','CLOUD','Cloud — a floating platform'],['rock','🪨','ROCK','Rock — heavy and lumpy']]],
 ['😀','Faces',[['bsleepy','😴','SLEEPY','Sleepy blob friend'],['bgrump','😠','GRUMPY','Grumpy blob friend'],['bcool','😎','COOL','Cool blob friend'],['bsilly','😜','SILLY','Silly blob friend'],['bbig','🫠','BIG BLOB','Big wobbly blob']]]];
const TIP={};TRAY.forEach(c=>c[2].forEach(t=>TIP[t[0]]=t[3]));ITEMS.forEach(t=>t&&(TIP[t[0]]??=t[3]));
const opt={size:1,bounce:-1,soft:0,rand:false};
(()=>{const tray=$('#tray'),items=$('#tritems'),cats=$('#trcats');
 const all=mkBtn(cats,'call','🗂️','ALL','Show everything',()=>items.scrollTo({left:0,behavior:'smooth'}));all.querySelector('small').style.cssText='margin:0;font-size:12px';
 TRAY.forEach(([ic,name,list])=>{const h=document.createElement('span');h.className='cath';h.textContent=name.toUpperCase();h.dataset.cat=name;items.appendChild(h);
